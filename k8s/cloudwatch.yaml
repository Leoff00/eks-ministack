apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-eks-logs-config
  namespace: kube-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         2
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        storage.path  /fluent-bit/state

    [INPUT]
        Name              tail
        Path              /var/log/containers/hello-eks-*_default_web-*.log
        Tag               hello-eks.*
        Parser            cri
        DB                /fluent-bit/state/hello-eks-cloudwatch.db
        Read_from_Head    On
        Refresh_Interval  5
        Skip_Long_Lines   On
        storage.type      filesystem

    [OUTPUT]
        Name               cloudwatch
        Match              hello-eks.*
        Region             us-east-1
        Log_Group_Name     /eks/ministack-lab/hello-eks
        Log_Stream_Prefix  pod-
        Log_Key            message
        Auto_Create_Group  Off
        Endpoint           http://ministack:4566
        Retry_Limit        False
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hello-eks-logs
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: hello-eks-logs
  template:
    metadata:
      labels:
        app: hello-eks-logs
      annotations:
        # Incremente ao alterar fluent-bit.conf para carregar a nova configuração.
        config-revision: "1"
    spec:
      # MiniStack inicia o k3s no Docker; o DNS Docker só é acessível na rede do nó.
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.11"]
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable@sha256:a2ca32547c4713061b21cb45b3a9facf5b7b8de686550a1efd4ae61a36d127aa
          command: ["/fluent-bit/bin/fluent-bit"]
          args: ["-e", "/fluent-bit/cloudwatch.so", "-c", "/fluent-bit/config/fluent-bit.conf"]
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_REGION
              value: us-east-1
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/config
              readOnly: true
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: hello-eks-logs-config
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/hello-eks-fluent-bit
            type: DirectoryOrCreate
